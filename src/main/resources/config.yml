# StealCraft – Einstellungen
# Nach einer Änderung den Server neu starten.

# Was passiert mit jemandem, der ohne Werkbank stirbt?
#   BAN       = wird gebannt und vom Server geworfen (für das echte Projekt)
#   ZUSCHAUER = bleibt als Zuschauer auf dem Server (praktisch zum Testen)
ausscheiden: BAN

# Soll im Chat stehen, WER eine Werkbank geklaut hat?
#   false = alle sehen nur, dass die Werkbank von Team X weg ist
#   true  = der Name des Diebs wird verraten
dieb-verraten: false

# Team-Werkbänke dürfen nicht in die Enderkiste,
# weil man sie dort niemals klauen könnte.
enderkiste-sperren: true

# Die Werkbank darf nur im Umkreis von so vielen Blöcken von einem Bett
# des eigenen Teams aufgestellt werden. Betten registrieren Teammitglieder,
# indem sie ein Bett platzieren.
bett-abstand: 50

# Werkbank-Anzeige: Wer seine Werkbank sehr tief oder sehr hoch versteckt,
# dessen Standort wird regelmäßig allen Spielern angezeigt.
anzeige:
  aktiv: true
  intervall-minuten: 30
  # Angezeigt werden Werkbänke UNTER dieser Höhe ...
  unter-y: -30
  # ... oder ÜBER dieser Höhe.
  ueber-y: 95
  # Wie lange ein Lichtstrahl über der Werkbank zu sehen ist (0 = kein Strahl).
  strahl-sekunden: 60
