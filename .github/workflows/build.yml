name: Plugin bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Bauen
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: StealCraft-Plugin
          path: build/libs/StealCraft-*.jar

      # Puts the newest .jar on the repository's Releases page ("Neueste Version").
      - name: Release aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view neueste >/dev/null 2>&1 || \
            gh release create neueste --title "StealCraft-Plugin (neueste Version)" \
              --notes "Die .jar-Datei unten herunterladen und in den Ordner plugins des Servers legen." --latest
          for a in $(gh release view neueste --json assets --jq '.assets[].name'); do gh release delete-asset neueste "$a" -y; done
          gh release upload neueste build/libs/StealCraft-*.jar --clobber
