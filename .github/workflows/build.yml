# Checks on every push and pull request that the plugin still compiles.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Bauen
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: StealCraft-Plugin
          path: build/libs/StealCraft-*.jar
