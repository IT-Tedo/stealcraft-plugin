# Builds the plugin and publishes a GitHub release with the .jar attached and the
# matching section of CHANGELOG.md as patch notes. Start it either by pushing a tag
# like v1.2.0, or in GitHub under Actions -> Release -> "Run workflow" (creates the tag).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Version prüfen
        run: |
          GRADLE=$(grep -E '^version = ' build.gradle.kts | sed -E 's/version = "(.*)"/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$GRADLE" ]; then
              echo "::error::Tag v$TAG passt nicht zur Version $GRADLE in build.gradle.kts"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$GRADLE" >/dev/null; then
            echo "::error::Version $GRADLE wurde schon veröffentlicht. Erst die Version in build.gradle.kts und CHANGELOG.md erhöhen."
            exit 1
          fi
          echo "VERSION=$GRADLE" >> "$GITHUB_ENV"

      - name: Bauen
        run: gradle build --no-daemon

      - name: Patchnotes aus CHANGELOG.md holen
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[0-9]/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Kein Eintrag für $VERSION in CHANGELOG.md"
            exit 1
          fi
          printf '\n---\n**Installation:** Die `.jar` unten herunterladen und in den Ordner `plugins` eines Paper-26.3-Servers legen.\n' >> notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/libs/StealCraft-*.jar \
            --target "$GITHUB_SHA" --title "StealCraft $VERSION" --notes-file notes.md --latest
